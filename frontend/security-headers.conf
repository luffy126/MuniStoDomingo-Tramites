# Cabeceras de seguridad de los archivos estáticos (HTML, JS, CSS, fuentes, imágenes).
# Replican las de vite.config.ts (CABECERAS_SEGURIDAD), que en desarrollo y `vite preview`
# las aplica Vite; en producción las tiene que poner el proxy inverso.
#
# Se incluye con `include` dentro de cada `location` que usa add_header: nginx NO hereda
# los add_header del nivel superior en cuanto un location define uno propio.
# Las respuestas de /api/ no las usan: ya traen sus cabeceras desde helmet (backend).
#
# Strict-Transport-Security no va aquí: solo tiene sentido sobre HTTPS y este contenedor
# habla HTTP plano. Agrégala en el balanceador/proxy que termine el TLS.
#
# script-src admite 'unsafe-inline' y data: a propósito: el shell de arranque de index.html
# (evita el destello de tema) y el legado de Ionic inyectan scripts inline.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline' data:; connect-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
