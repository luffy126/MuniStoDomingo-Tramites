server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Los adjuntos (PDF/JPG/PNG de hasta 5 MB) viajan como cuerpo binario crudo hacia
    # /api/solicitudes/.../documentos. El límite por defecto de nginx (1 MB) los
    # rechazaría con 413; 6 MB deja margen sobre el tope de 5 MB del backend.
    client_max_body_size 6m;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Assets con hash en el nombre (Vite) → caché larga
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Fuentes locales (Poppins, Montserrat) e íconos: sin hash en el nombre, caché moderada
    location ~ ^/(fonts|icons)/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html, el service worker y el manifest nunca se cachean, para que un nuevo
    # build (y un nuevo sw.js con otra versión de caché) se vea al instante
    location ~ ^/(index\.html|sw\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Proxy reverso hacia la API: el navegador llama a /api/... en el mismo origen (sin CORS)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: rutas del router (/login, /tabs/...) → index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
