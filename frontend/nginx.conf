server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Assets con hash en el nombre (Vite) → caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que un nuevo build se vea al instante
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy reverso hacia la API: el navegador llama a /api/... en el mismo origen (sin CORS)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: rutas del router (/login, /tabs/...) → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
