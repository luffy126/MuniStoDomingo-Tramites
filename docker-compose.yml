# MuniStoDomingo-Tramites — orquestación completa (MariaDB + API + frontend)
# Uso: docker compose --env-file .env.docker up --build
# (no hace falta XAMPP ni MySQL instalado: la base de datos corre en el contenedor `db`)
name: munistodomingo

services:
  # ── Base de datos ────────────────────────────────
  db:
    image: mariadb:11
    container_name: muni-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-devpass}
      MARIADB_DATABASE: ${DB_NAME:-muni_stodomingo}
      MARIADB_USER: ${DB_USER:-muniapp}
      MARIADB_PASSWORD: ${DB_PASSWORD:-munipass}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # Solo desde este equipo: con las claves de ejemplo no debe verse desde la red.
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Solo se ejecuta con el volumen vacío (primer arranque o tras `down -v`)
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - muni-net

  # ── Backend (API) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: muni-backend
    container_name: muni-backend
    restart: unless-stopped
    init: true               # reenvía SIGTERM: `docker compose stop` cierra al instante
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db            # nombre del servicio, no localhost
      DB_PORT: 3306
      DB_USER: ${DB_USER:-muniapp}
      DB_PASSWORD: ${DB_PASSWORD:-munipass}
      DB_NAME: ${DB_NAME:-muni_stodomingo}
      JWT_SECRET: ${JWT_SECRET:-clave_super_segura_de_al_menos_32_caracteres_aqui}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      # Base de los enlaces de los correos (recuperar contraseña). compartir.bat la cambia
      # por la URL pública mientras comparte y la devuelve a localhost al terminar.
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:${FRONTEND_PORT:-8080}}
      # Saltos de proxy de confianza para la IP real en el rate limit: 1 = Nginx.
      # compartir.bat usa 2 (Cloudflare + Nginx); no lo subas a mano sin túnel.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Límites (por IP y por vecino). Los valores por defecto son los del backend.
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      GENERAL_RATE_LIMIT_MAX: ${GENERAL_RATE_LIMIT_MAX:-100}
      UPLOAD_RATE_LIMIT_MAX: ${UPLOAD_RATE_LIMIT_MAX:-20}
      CUOTA_DOCUMENTOS_MB: ${CUOTA_DOCUMENTOS_MB:-50}
      MAX_SOLICITUDES_ABIERTAS: ${MAX_SOLICITUDES_ABIERTAS:-20}
      # Adjuntos: carpeta definida en el Dockerfile, respaldada por el volumen uploads_data
      UPLOAD_DIR: /app/uploads
      # Servicio de email (Resend): 2FA, recuperación de contraseña y avisos de estado.
      # Sin API key el backend hace dry run (los correos se ven en `docker compose logs backend`).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-MuniStoDomingo <onboarding@resend.dev>}
      EMAIL_REDIRECT_TO: ${EMAIL_REDIRECT_TO:-}
      # Solo QA/demos: 1 = el dry run imprime el enlace completo de recuperación de contraseña
      MOSTRAR_TOKEN_RECUPERACION: ${MOSTRAR_TOKEN_RECUPERACION:-0}
    ports:
      # Acceso directo a la API solo desde este equipo (sin pasar por Nginx, p. ej. Postman).
      # Expuesta a la red, quien la use podría falsear X-Forwarded-For y saltarse el rate limit.
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - muni-net

  # ── Frontend (Nginx + SPA) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /      # rutas relativas → el proxy de Nginx reenvía /api/
    image: muni-frontend
    container_name: muni-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - muni-net

volumes:
  db_data:
  uploads_data:

networks:
  muni-net:
    driver: bridge
